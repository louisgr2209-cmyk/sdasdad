<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Präsident – Der Staatssimulator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ═════════ Startbildschirm ═════════ -->
  <section id="screen-start" class="screen active">
    <canvas id="start-map" class="bg-map"></canvas>
    <div class="start-inner">
      <div class="logo-badge">🏛️</div>
      <h1 class="game-title">PRÄSIDENT</h1>
      <p class="game-sub">Der Staatssimulator</p>
      <p class="tagline">Übernimm ein echtes Land. Triff Entscheidungen. Überlebe Krisen. Schreibe Geschichte.</p>
      <div class="start-buttons">
        <button class="btn btn-primary btn-lg" data-action="new-game">▶ Neues Spiel</button>
        <button class="btn btn-lg" data-action="continue" id="btn-continue">⟳ Spiel fortsetzen</button>
        <button class="btn btn-lg" data-action="import">📂 Spielstand laden</button>
        <button class="btn btn-lg" data-action="help">❔ Anleitung</button>
      </div>
      <p class="start-foot">Tipp: Du musst kein Politik-Profi sein – deine Berater helfen dir bei jeder Entscheidung.</p>
    </div>
  </section>

  <!-- ═════════ Spielvorbereitung ═════════ -->
  <section id="screen-setup" class="screen">
    <header class="setup-head">
      <button class="btn btn-ghost" data-action="back-start">← Zurück</button>
      <h2>Wähle dein Land</h2>
      <div class="setup-filter" id="setup-filter"></div>
    </header>
    <div class="setup-body">
      <div class="country-grid" id="country-grid"></div>
      <aside class="setup-detail" id="setup-detail"></aside>
    </div>
  </section>

  <!-- ═════════ Hauptspiel ═════════ -->
  <section id="screen-game" class="screen">
    <header class="topbar" id="topbar"></header>
    <nav class="sidebar" id="sidebar"></nav>
    <main class="view" id="view"></main>
    <footer class="ticker"><span class="ticker-label">EILMELDUNG</span><div class="ticker-track" id="ticker"></div></footer>
  </section>

  <!-- ═════════ Spielende ═════════ -->
  <section id="screen-end" class="screen"></section>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="tooltip" class="tooltip"></div>
  <input type="file" id="file-import" accept=".json,application/json" hidden>

  <script src="js/data/worldmap.js"></script>
  <script src="js/data/countries.js"></script>
  <script src="js/data/policies.js"></script>
  <script src="js/data/events.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
